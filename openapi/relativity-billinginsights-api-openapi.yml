openapi: 3.2.0
info:
  title: Relativity Billing Insights API
  x-relativity-api-visibility: public
  version: '1.0'
  description: 'Operations tagged BillingInsights across 2 of this provider''s published API definitions: relativity-billing-v1-openapi.yml, relativity-billing-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://billing-insights.api.relativity.one/billing-drilldown-api
  description: Production
- url: https://services.vaus.relativityone.us/billing-drilldown-api/
  description: Government
security:
- {}
tags:
- name: BillingInsights
paths:
  /api/v1/billing-insights/hierarchy-lookup/{level}:
    get:
      tags:
      - BillingInsights
      summary: Get artifact ids
      description: Get artifact ids for workspace, matter, client, instance that can be used for filtering billing users and month details data.
      parameters:
      - name: level
        in: path
        description: The hierarchy level
        required: true
        schema:
          enum:
          - Workspace
          - Matter
          - Client
          - Instance
          - Contract
          type: string
      - name: instanceId
        in: query
        description: The instance ID
        schema:
          type: string
      - name: shouldUnhashData
        in: query
        description: Specifies if the response should include unhashed data. Default value is false.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
