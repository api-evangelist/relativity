components:
  schemas:
    GetMonthDetailsResponse:
      type: object
      properties:
        results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GetMonthDetailsResponseItem'
        pagingResponse:
          $ref: '#/components/schemas/PagingResponse'
        status:
          enum:
          - OK
          - ContractExpired
          - ContractNotAvailable
          - ContractInPreparation
          - MissingDataForContract
          - FunctionalityDisabled
          - MissingMetricsGuid
          type: string
      additionalProperties: false
    Money:
      type: object
      properties:
        value:
          type: number
          description: Monetary value
          format: double
        currency:
          type:
          - string
          - 'null'
          description: ISO 4217 currency code
      additionalProperties: false
    GetUsersDetailsResponse:
      type: object
      properties:
        results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GetUsersDetailsResponseItem'
        pagingResponse:
          $ref: '#/components/schemas/PagingResponse'
      additionalProperties: false
    ClientMatterData:
      type: object
      properties:
        clientArtifactId:
          type: integer
          format: int32
        matterArtifactId:
          type: integer
          format: int32
      additionalProperties: false
    FieldFilter:
      type: object
      properties:
        fieldName:
          type:
          - string
          - 'null'
          description: Name of a field to which filtering will be applied
        operator:
          type:
          - string
          - 'null'
          description: 'Specifies a filtering operator

            List of possible values:

            - "="

            - "<"

            - ">"

            - "<="

            - ">="'
        value:
          type:
          - string
          - 'null'
          description: Specifies a filter value
      additionalProperties: false
      description: Field filter information
    SinglePricedMetric:
      type: object
      properties:
        collectionTimeUtc:
          type:
          - string
          - 'null'
          description: Date when the value was collected
          format: date-time
        metadata:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MetricMetadata'
        comment:
          type:
          - string
          - 'null'
          description: Additional information related to the current metric
        subMetrics:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/SingleSubMetric'
        billableValue:
          type: number
          description: Value reported for the metric (billable usage)
          format: double
        amount:
          $ref: '#/components/schemas/Money'
        missingCostReason:
          type:
          - string
          - 'null'
          description: Reason for the missing cost if applicable.
          example: "\n            Cost breakdown not available at this level of the hierarchy\n            "
      additionalProperties: false
    GetHierarchyLookupResponseItem:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name of the item
        anonymization:
          type:
          - string
          - 'null'
          description: 'Flag that identifies if the name is hashed.

            If the value is _Hashed_ then value of a _Name_ field is replaced with hash

            List of possible values:

            - Hashed

            - None'
        anonymizedFields:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
          description: Collection that holds what type of data is hashed.
        selector:
          $ref: '#/components/schemas/HierarchyItemSelector'
      additionalProperties: false
    GetMonthDetailsResponseItem:
      type: object
      properties:
        contract:
          $ref: '#/components/schemas/Contract'
        instance:
          $ref: '#/components/schemas/Instance'
        client:
          $ref: '#/components/schemas/Client'
        matter:
          $ref: '#/components/schemas/Matter'
        workspace:
          $ref: '#/components/schemas/Workspace'
        usageMetrics:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/SingleUsageMetric'
          description: 'Usage metric represents current usage of the data or in case if previous month is requested it will represent state from the last day of monthly report.

            Each property in this object is one of the _metricKeys_ specified in the request. If the usage metric does not exist for given item, it will be missing in the object.'
        pricedMetrics:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/SinglePricedMetric'
          description: "Priced metric represents billable data on the date when peak of the usage occurred. \nEach property in this object is one of the _metricKeys_ specified in the request. If the priced metric does not exist for given item, it will be missing in the object."
        pricedMetricsSubMetricsSummary:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/SingleSubMetric'
          description: 'Submetrics related to the priced metric.

            Each property in this object is one of the _subMetricsSummaryKeys_ specified in the request. If the submetric does not exist for priced item, it will have zero Value in the object.'
        usageMetricsSubMetricsSummary:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/SingleSubMetric'
          description: 'Submetrics related to the usage metric.

            Each property in this object is one of the _subMetricsSummaryKeys_ specified in the request. If the submetric does not exist for usage item, it will have zero Value in the object.'
      additionalProperties: false
    HierarchyItemSelector:
      type: object
      properties:
        contractID:
          type:
          - string
          - 'null'
        instanceID:
          type:
          - string
          - 'null'
        clientArtifactID:
          type:
          - integer
          - 'null'
          format: int32
        matterArtifactID:
          type:
          - integer
          - 'null'
          format: int32
        workspaceArtifactID:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
      description: 'Specifies item to select.

        instanceID_ must be provided, additionally depending on the chosen level must be provided _clientArtifactID_, _matterArtifactID_ or _workspaceArtifactID'
    Contract:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: ID of the contract
        name:
          type:
          - string
          - 'null'
          description: Name of the contract
      additionalProperties: false
      description: Contract information
    PagingRequest:
      type: object
      properties:
        top:
          type:
          - integer
          - 'null'
          description: Return top N records
          format: int32
        skip:
          type:
          - integer
          - 'null'
          description: Exclude first N records
          format: int32
        maxItemCount:
          type:
          - integer
          - 'null'
          description: 'Specifies maximum number of records that should be returned from the API

            - If there are more records to fetch, the _continuationToken_ is returned in the _pagingResponse_'
          format: int32
        includeCount:
          type:
          - boolean
          - 'null'
          description: Specifies that _totalRecordCount_ should be included in the _pagingResponse_
        continuationToken:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: 'Specifies paging options

        - _top_ and _skip_ values need to be either empty or populated. Specifying just a single value is considered a bad request.

        - if _top_ and _skip_ are specified and _maxItemCount_ is not specified, _continuationToken_ will not be returned.The API guarantees that all the records were populated, and there is no need to fetch additional records.

        - In all other cases, _continuationToken_ might be returned, indicating there are more records to fetch.'
    Workspace:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: ID of the workspace (GUID)
        artifactID:
          type: integer
          description: Artifact ID of the workspace
          format: int32
        name:
          type:
          - string
          - 'null'
          description: Name of the workspace
        activityStatus:
          type:
          - string
          - 'null'
          description: 'Workspace status. Could be one of the following:

            - Active

            - Inactive

            - Archived

            - Deleted'
        billableStatus:
          type:
          - string
          - 'null'
          description: 'Specifies billable status of the workspace

            List of possible values:

            - Billable

            - Non-billable

            - Billable Plaintiff'
        billableComment:
          type:
          - string
          - 'null'
          description: Additional information about billable status, populated when _billableStatus_ is _Non-billable_
        anonymization:
          type:
          - string
          - 'null'
          description: 'Flag that identifies if workspace data is hashed.

            If the value is _Hashed_ then value of a _Name_ field is replaced with _ArtifactID_ value.

            List of possible values:

            - Hashed

            - None'
        billableType:
          type:
          - string
          - 'null'
          description: 'Specifies billable type of the workspace

            List of possible values:

            - Repository

            - Review

            - Cold Storage'
        anonymizedFields:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
          description: Object that holds what type of workspace data is hashed.
        projectType:
          type:
          - string
          - 'null'
          description: Object that holds what type of use case the workspace has.
      additionalProperties: false
      description: Workspace information
    Instance:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Instance ID (GUID)
        name:
          type:
          - string
          - 'null'
          description: Instance name
        pricingVisibility:
          enum:
          - Visible
          - HiddenResoldInstance
          - HiddenFixedContract
          type: string
          description: 'Instance pricing visibility:

            - Visible : pricing details are visible

            - HiddenResoldInstance : pricing details are hidden due to resold of the instance

            - HiddenFixedContract : pricing details are hidden because of fixed contracts with zero rates'
      additionalProperties: false
      description: Instance information
    GetMonthDetailsRequest:
      type: object
      properties:
        dateKey:
          type:
          - string
          - 'null'
          description: 'Specifies the year and the month for which details should be returned. Format: YYYYMM.'
