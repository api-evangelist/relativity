          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SelectedCollectionCriteriaModel'
      additionalProperties: false
    ActionResult:
      type: object
      additionalProperties: false
    CollectionJobTargetModel:
      type: object
      properties:
        ArtifactId:
          type: integer
          format: int32
        Target:
          type:
          - string
          - 'null'
        SourceInstance:
          type:
          - string
          - 'null'
        Items:
          type: integer
          format: int32
        Errors:
          type: integer
          format: int32
        Size:
