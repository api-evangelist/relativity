components:
  schemas:
    Microsoft.AspNetCore.Mvc.ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    ReportJobsResponse:
      type: object
      properties:
        reportJobs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReportJobResponse'
        paging:
          $ref: '#/components/schemas/Page'
      additionalProperties: false
    ReportJobResponse:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
        path:
          type:
          - string
          - 'null'
        createdOn:
          type: string
          format: date-time
        state:
          type:
          - string
          - 'null'
        includeFiles:
          type: boolean
        depth:
          $ref: '#/components/schemas/ReportDepth'
        useSnapshot:
          type: boolean
        captureStart:
          type: string
          format: date-time
        captureEnd:
          type: string
          format: date-time
        reportCategory:
          $ref: '#/components/schemas/ReportCategory'
        reportDate:
          type:
          - string
          - 'null'
          description: For Summary reports, the source CSV date (YYYYMMDD); otherwise null.
        errorMessage:
          type:
          - string
          - 'null'
          description: Sanitized, user-facing failure reason. Populated only when `state` is `Failed` (see Failure reporting in the implementation notes); null otherwise. Omitted from the JSON payload when null.
      additionalProperties: false
    Page:
      required:
      - limit
      - start
      type: object
      properties:
        start:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
        limit:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
      additionalProperties: false
    ReportDepth:
      enum:
      - TopLevelOnly
      - OneLevelDeep
      - TwoLevelsDeep
      - FullHierarchy
      type: string
    DirectoryReportRequest:
      required:
      - depth
      - path
      type: object
      properties:
        path:
          minLength: 1
          type: string
        includeFiles:
          type: boolean
        depth:
          $ref: '#/components/schemas/ReportDepth'
        useSnapshot:
          type: boolean
        date:
          pattern: ^\d{8}$
          type:
          - string
          - 'null'
          description: Optional. When provided in YYYYMMDD format, a Summary report is produced from the Billable Summary CSV for the container/date combination instead of scanning storage.
      additionalProperties: false
    ReportCategory:
      enum:
      - DetailedReport
      - SummaryReport
      type: string
    ReportResponse:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
      additionalProperties: false
    ReportsDto:
      type: object
      properties:
        reports:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReportDto'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    DateRangeDto:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
