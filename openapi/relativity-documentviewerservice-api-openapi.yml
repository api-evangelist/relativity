openapi: 3.2.0
info:
  title: reviewservice (public) Document Viewer Service API
security:
- Bearer: []
tags:
- name: DocumentViewerService
paths:
  /v{version}/DocumentViewerServiceManager/GetViewerContentKeyAsync:
    post:
      tags:
      - DocumentViewerService
      summary: Submits a conversion request and returns a viewer content key for document…
      description: 'Supports document, production, image, and file-field conversion scenarios used by the Document Viewer REST API.

        The returned value includes keys used to track conversion and retrieve converted content.'
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Request payload containing workspace, document identifiers, conversion type, and conversion options.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reviewservice.Api.V2.Models.ViewerContentKeyRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Reviewservice.Api.V2.Models.ViewerContentKeyRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Reviewservice.Api.V2.Models.ViewerContentKeyRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Relativity.DocumentViewer.Domain.DTOs.ViewerContentKey'
            application/json:
              schema:
                $ref: '#/components/schemas/Relativity.DocumentViewer.Domain.DTOs.ViewerContentKey'
            text/json:
              schema:
                $ref: '#/components/schemas/Relativity.DocumentViewer.Domain.DTOs.ViewerContentKey'
      operationId: postV{version}DocumentViewerServiceManagerGetViewerContentKeyAsync
      x-operation-id-source: derived
components:
  schemas:
    Relativity.DocumentViewer.Domain.GetViewerContentKeyOptions:
      type: object
      properties:
        ProductionId:
          type:
          - integer
          - 'null'
          format: int32
        ForceConversion:
          type: boolean
        FileId:
          type:
          - integer
          - 'null'
          format: int32
        DocumentSetId:
          type:
          - string
          - 'null'
        ClientId:
          type:
          - string
          - 'null'
        CorrelationId:
          type: string
          format: uuid
      additionalProperties: false
    Relativity.DocumentViewer.Domain.ConversionType:
      enum:
      - None
      - Native
      - Image
      - Production
      - Transcript
      - HTMLImage
      - HTMLProduction
      - Text
      - ProducedNative
      - PDF
      type: string
    Relativity.DocumentViewer.Domain.DTOs.ViewerContentKey:
      type: object
      properties:
        RequestKey:
          type:
          - string
          - 'null'
          format: uuid
        CacheEntryId:
          type:
          - integer
          - 'null'
          format: int64
        DocumentArtifactId:
          type: integer
          format: int32
        ConversionVersion:
          type:
          - string
          - 'null'
        Priority:
          type: integer
          format: int32
        WorkspaceArtifactId:
          type: integer
          format: int32
        ViewerType:
          type: integer
          format: int32
        Priority2ViewerContentKeys:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Relativity.DocumentViewer.Domain.DTOs.ViewerContentKey'
        MinimalFilesManifest:
          type:
          - string
          - 'null'
        ErrorId:
          type: integer
          format: int64
          readOnly: true
        ErrorMessage:
          type:
          - string
          - 'null'
        IsPartialConversion:
          type: boolean
        VersionKey:
          type:
          - string
          - 'null'
        SemanticCacheKey:
          type:
          - string
          - 'null'
        LimitedOutput:
          type: boolean
        PasswordRequested:
          type: boolean
        DocumentPassword:
          type:
          - string
          - 'null'
      additionalProperties: false
    Reviewservice.Api.V2.Models.ViewerContentKeyRequest:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/Relativity.DocumentViewer.Domain.DTOs.V2.GetViewerContentKeyRequest'
      additionalProperties: false
    Relativity.DocumentViewer.Domain.DTOs.V2.GetViewerContentKeyRequest:
      type: object
      properties:
        WorkspaceId:
          type: integer
          format: int32
        DocumentIds:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        ConversionType:
          $ref: '#/components/schemas/Relativity.DocumentViewer.Domain.ConversionType'
        Priority:
          $ref: '#/components/schemas/Review.Shared.PriorityLevel'
        Options:
          $ref: '#/components/schemas/Relativity.DocumentViewer.Domain.GetViewerContentKeyOptions'
      additionalProperties: false
    Review.Shared.PriorityLevel:
      enum:
      - None
      - OnTheFly
      - ConvertAhead
      - MassConvert
      type: string
  securitySchemes:
    Bearer:
      type: http
      description: 'Standard Authorization header using the Bearer scheme. Example: "bearer {token}"'
      scheme: bearer
      bearerFormat: JWT
