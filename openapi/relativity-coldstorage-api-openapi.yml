openapi: 3.2.0
info:
  title: Workspace Service Cold Storage API
  description: 'The Workspace Service API provides a REST service for managing workspace creation and maintenance.


    The URL prefix for workspace services endpoints: https://\/api/workspace-service'
  version: '1'
  x-relativity-api-visibility: public
security:
- Bearer: []
tags:
- name: ColdStorage
paths:
  /v1/workspace/{workspaceId}/cold-storage/status:
    get:
      tags:
      - ColdStorage
      summary: Gets the cold storage status of a workspace
      description: 'Returns one of:

        Out – Workspace is not in cold storage.

        In – Workspace is in cold storage.

        MovingOut – Retrieval has been requested; the workspace will be returned to Active by the retrieval agent after the minimum request age has elapsed.

        For MovingOut, ActivationJobSubmittedBy and ActivationJobSubmittedOnUtc identify the user who requested retrieval (secured when the caller cannot view the user).'
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/WorkspaceColdStorageStatusResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceColdStorageStatusResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/WorkspaceColdStorageStatusResponse'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      operationId: getV1WorkspaceByWorkspaceIdColdStorageStatus
      x-operation-id-source: derived
components:
  schemas:
    ObjectIdentifier:
      type: object
      properties:
        ArtifactID:
          type:
          - integer
          - 'null'
          format: int32
        Guids:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
      additionalProperties: false
    ObjectIdentifierSecurable:
      type: object
      properties:
        Value:
          $ref: '#/components/schemas/ObjectIdentifier'
        Secured:
          type: boolean
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    WorkspaceColdStorageStatusResponse:
      type: object
      properties:
        WorkspaceID:
          type: integer
          format: int32
        Status:
          enum:
          - Out
          - In
          - MovingOut
          - MovingIn
          type: string
        ActivationJobSubmittedBy:
          $ref: '#/components/schemas/ObjectIdentifierSecurable'
        ActivationJobSubmittedOnUtc:
          type:
          - string
          - 'null'
          format: date-time
        AddedToColdStorageOnUtc:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: 'Standard Authorization header using the Bearer scheme. Example: "bearer {token}"'
      scheme: bearer
      bearerFormat: JWT
