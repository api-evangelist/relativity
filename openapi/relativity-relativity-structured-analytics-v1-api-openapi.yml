      description: '[Public] IJobManager -'
      operationId: Relativity.StructuredAnalytics.V1.Jobs.IJobManager.CancelAsync
      parameters:
      - $ref: '#/components/parameters/workspaceID'
      - $ref: '#/components/parameters/sasArtifactID'
