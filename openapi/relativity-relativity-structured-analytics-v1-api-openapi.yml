      summary: Relativity structured analytics V1 jobs IJob manager cancel copy to legacy async
      x-summary-source: derived
  /relativity-structured-analytics/v1/workspaces/{workspaceID}/sets/{sasArtifactID}/jobs/:
    delete:
      tags:
