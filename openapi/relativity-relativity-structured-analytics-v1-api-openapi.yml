components:
  schemas:
    EmailThreadingStatistics:
      title: EmailThreadingStatistics
      type: object
      properties:
        EmailsAnalyzed:
          type: integer
        InclusiveEmails:
          type: integer
        DocumentsAnalyzed:
          type: integer
    MasterJob:
      title: MasterJob
      type: object
      properties:
        TaskID:
          type: integer
        WorkspaceID:
          type: integer
        ResourceGroupID:
          type: integer
        Status:
          type: integer
        JobArtifactID:
          type: integer
        Handled:
          type:
          - string
          - 'null'
          format: date-time
        DBLocation:
          type: string
        Retries:
          type: integer
        PopulateAll:
          type: boolean
        AnalyzeAll:
          type: boolean
        StatusAtCancel:
          type: integer
        UpgradeStatusComplete:
          type:
          - boolean
          - 'null'
        InitiatorGuid:
          type:
          - string
          - 'null'
    SASDocumentErrorsResponseObject:
      title: SASDocumentErrorsResponseObject
      type: object
      properties:
        DocumentErrors:
          type: array
          items:
            $ref: '#/components/schemas/DocumentError'
        TotalCount:
          type: integer
    DocumentError:
      title: DocumentError
      type: object
      properties:
        DocumentArtifactID:
          type: integer
        DocumentIdentifier:
          type: string
        Message:
          type: string
        Operations:
          type: array
          items:
            enum:
            - EmailThreading
            - TextualNearDuplicateID
            - LanguageID
            - RepeatedContentID
            - NameNormalizationID
            type: string
        Status:
          enum:
          - IncludedInSet
          - RemovedFromSet
          - DataWarning
          type: string
        DateErrored:
          type: string
          format: date-time
    ValidTaskResult:
      title: ValidTaskResult
      type: object
      properties:
        ValidTasks:
          type: array
          items:
            enum:
            - CANCEL_ANALYSIS
            - RETRY_ERRORS
            - GET_SET_ERRORS
            - GET_DOCUMENT_ERRORS
            - COPY_TO_LEGACY
            - COPY_TO_LEGACY_CANCEL
            - PREPARE_ANALYSIS
            - RUN_ANALYSIS
            type: string
        CopyToLegacyQualified:
          type: boolean
    TextualNearDuplicatesStatistics:
      title: TextualNearDuplicatesStatistics
      type: object
      properties:
        AverageSimilarityPercentage:
          type: number
        GroupsCount:
          type: integer
        DocumentsAnalyzed:
          type: integer
    Status:
      title: Status
      type: object
      properties:
        JobName:
          type: string
        JobState:
          $ref: '#/components/schemas/JobState'
        OperationState:
          type: array
          items:
            $ref: '#/components/schemas/OperationState'
        JobResults:
          $ref: '#/components/schemas/JobResults'
    OperationState:
      title: OperationState
      type: object
      properties:
        Operation:
          enum:
          - EmailThreading
          - TextualNearDuplicateID
          - LanguageID
          - RepeatedContentID
          - NameNormalizationID
          type: string
        Phase:
          enum:
          - Not_Started
          - Setup
          - SyncingData
          - CalculatingFileSizes
          - QueuedForExport
          - Exporting
          - CompletedExporting
          - QueuedForAnalysis
          - RunningOperations
          - CompletedOperations
          - QueuedForImport
          - ImportingEntityAndAliases
          - Importing
          - Finalizing
          - Completed
          - CompletedWithErrors
          - Error
          - RetryErrors
          - Canceling
          - Canceled
          - MissingFields
          - CopyToLegacyInProgress
          - CopyToLegacyCancelling
          - PreparingAnalysisInProgress
          - PreparingAnalysisCompleted
          - PreparingAnalysisError
          - Unknown
          type: string
        LastActivity:
          type:
          - string
          - 'null'
          format: date-time
    NameNormalizationStatistics:
      title: NameNormalizationStatistics
      type: object
      properties:
        AliasesIdentified:
          type: integer
        NewAliasesImported:
          type: integer
    OperationResult:
      title: OperationResult
      type: object
      properties:
        IsSuccess:
          type: boolean
        Message:
          type: string
    JobResults:
      title: JobResults
      type: object
      properties:
        DocumentsAnalyzed:
          type: integer
        EmailThreadingStats:
          $ref: '#/components/schemas/EmailThreadingStatistics'
        NameNormalizationStats:
          $ref: '#/components/schemas/NameNormalizationStatistics'
        TextualNearDupeStats:
          $ref: '#/components/schemas/TextualNearDuplicatesStatistics'
    JobState:
      title: JobState
      type: object
      properties:
        Status:
          type: string
        Phase:
          enum:
          - Not_Started
          - Setup
          - SyncingData
          - CalculatingFileSizes
          - QueuedForExport
          - Exporting
          - CompletedExporting
          - QueuedForAnalysis
          - RunningOperations
          - CompletedOperations
          - QueuedForImport
          - ImportingEntityAndAliases
          - Importing
          - Finalizing
          - Completed
          - CompletedWithErrors
          - Error
          - RetryErrors
          - Canceling
          - Canceled
          - MissingFields
          - CopyToLegacyInProgress
          - CopyToLegacyCancelling
          - PreparingAnalysisInProgress
          - PreparingAnalysisCompleted
          - PreparingAnalysisError
          - Unknown
          type: string
        IsRunning:
          type: boolean
        IsRunningOperations:
          type: boolean
        IsCompleted:
          type: boolean
        IsCanceled:
          type: boolean
        IsCanceling:
          type: boolean
        IsQueued:
          type:
          - boolean
          - 'null'
        IsUnknown:
          type: boolean
        PhaseProgressPercentage:
          type: number
        JobTimeElapsed:
          type: integer
        OperationTimeElapsed:
          type: integer
    StructuredAnalyticsSetError:
      title: StructuredAnalyticsSetError
      type: object
      properties:
        FullText:
          type: string
        Message:
          type: string
        Server:
          type: string
        Source:
          type: string
    AnalysisSettings:
      title: AnalysisSettings
      type: object
      properties:
        PopulateAll:
          type: boolean
        AnalyzeAll:
          type: boolean
    SASDocumentErrorsRequestObject:
      title: SASDocumentErrorsRequestObject
      type: object
      properties:
        Sorts:
          type: array
          items:
            type: string
        Filters:
          type: array
          items:
            type: string
        Start:
          type: integer
        Length:
          type: integer
  parameters:
    sasArtifactID:
      name: sasArtifactID
      in: path
      description: ''
      required: true
      schema:
        type: integer
    start:
      name: start
      in: query
      description: ''
      schema:
        type: integer
        default: 0
    x-csrf-header:
      name: x-csrf-header
      in: header
      description: ''
      required: true
      schema:
        type: string
        default: '-'
    workspaceID:
      name: workspaceID
      in: path
      description: ''
      required: true
      schema:
        type: integer
    wait:
      name: wait
      in: query
      description: ''
      schema:
        type: boolean
        default: false
    length:
      name: length
      in: query
      description: ''
      schema:
        type: integer
        default: 0
