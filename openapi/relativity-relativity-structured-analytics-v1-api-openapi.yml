        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisSettings'
        required: true
      responses:
        '201':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
      summary: Relativity structured analytics V1 jobs IJob manager run async
      x-summary-source: derived
