openapi: 3.2.0
info:
  title: reviewservice (public) Persistent Highlight Service API
security:
- Bearer: []
tags:
- name: PersistentHighlightService
paths:
  /v{version}/workspaces/{workspaceID}/documents/{documentID}/highlight-sets:
    get:
      tags:
      - PersistentHighlightService
      summary: Retrieves persistent highlight sets and terms applied to a specific document
      description: Returns highlight set metadata and term definitions scoped to the specified document in the workspace.
      parameters:
      - name: workspaceID
        in: path
        description: Workspace's Artifact ID.
        required: true
        schema:
          type: integer
          format: int32
      - name: documentID
        in: path
        description: Document ID.
        required: true
        schema:
          type: integer
          format: int32
      - name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relativity.DocumentViewer.Services.V2.PersistentHighlightSetDTO'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relativity.DocumentViewer.Services.V2.PersistentHighlightSetDTO'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relativity.DocumentViewer.Services.V2.PersistentHighlightSetDTO'
      operationId: getV{version}WorkspacesByWorkspaceIDDocumentsByDocumentIDHighlightSets
      x-operation-id-source: derived
  /v{version}/workspaces/{workspaceID}/highlights/{persistentHighlightSetID}/state:
    post:
      tags:
      - PersistentHighlightService
      summary: Changes the active state of a persistent highlight set or selected terms
      description: Use this endpoint to activate or deactivate an entire set, or to change state for specific term identifiers.
      parameters:
      - name: workspaceID
        in: path
        description: Workspace's Artifact ID.
        required: true
        schema:
          type: integer
          format: int32
      - name: persistentHighlightSetID
        in: path
        description: Persistent Highlight Set's ID.
        required: true
        schema:
          type: integer
          format: int32
      - name: version
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Request body describing the state action and optional term identifiers.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reviewservice.Api.V2.Models.SavePersistentHighlightSetStateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Reviewservice.Api.V2.Models.SavePersistentHighlightSetStateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Reviewservice.Api.V2.Models.SavePersistentHighlightSetStateRequest'
      responses:
        '200':
          description: OK
      operationId: postV{version}WorkspacesByWorkspaceIDHighlightsByPersistentHighlightSetIDState
      x-operation-id-source: derived
  /v{version}/workspaces/{workspaceID}/highlight-sets:
    get:
      tags:
      - PersistentHighlightService
      summary: Retrieves all persistent highlight sets and terms available in a workspace
      parameters:
      - name: workspaceID
        in: path
        description: Workspace's Artifact ID.
        required: true
        schema:
          type: integer
          format: int32
      - name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relativity.DocumentViewer.Services.V2.PersistentHighlightSetDTO'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relativity.DocumentViewer.Services.V2.PersistentHighlightSetDTO'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relativity.DocumentViewer.Services.V2.PersistentHighlightSetDTO'
      operationId: getV{version}WorkspacesByWorkspaceIDHighlightSets
      x-operation-id-source: derived
  /v{version}/workspaces/{workspaceID}/highlights/{persistentHighlightSetID}/add-terms:
    post:
      tags:
      - PersistentHighlightService
      summary: Adds one or more new terms to an existing persistent highlight set
      description: Each term can include foreground and background colors that define how it appears in the viewer.
      parameters:
      - name: workspaceID
        in: path
        description: Workspace's Artifact ID.
        required: true
        schema:
          type: integer
          format: int32
      - name: persistentHighlightSetID
        in: path
        description: Persistent Highlight Set's ID.
        required: true
        schema:
          type: integer
          format: int32
      - name: version
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Request body containing terms to append to the highlight set.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reviewservice.Api.V2.Models.AddPersistentHighlightTermsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Reviewservice.Api.V2.Models.AddPersistentHighlightTermsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Reviewservice.Api.V2.Models.AddPersistentHighlightTermsRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: integer
                format: int32
            application/json:
              schema:
                type: integer
                format: int32
            text/json:
              schema:
                type: integer
                format: int32
      operationId: postV{version}WorkspacesByWorkspaceIDHighlightsByPersistentHighlightSetIDAddTerms
      x-operation-id-source: derived
components:
  schemas:
    Relativity.DocumentViewer.Domain.DTOs.PersistentHighlightTerm:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
        Term:
          type:
          - string
          - 'null'
        Syntax:
          type:
          - string
          - 'null'
        BackgroundColor:
          type:
          - string
          - 'null'
        ForegroundColor:
          type:
          - string
          - 'null'
        PersistentHighlightTermId:
          type: integer
          format: int64
        PersistentHighlightSetId:
          type: integer
          format: int64
        Selected:
          type: boolean
      additionalProperties: false
    Reviewservice.Api.V2.Models.AddPersistentHighlightTermsRequest:
      type: object
      properties:
        workspaceId:
          type: integer
          description: Gets or sets workspaceId.
          format: int32
        persistentHighlightSetId:
          type: integer
          description: Gets or sets persistentHighlightSetId.
          format: int32
        terms:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Relativity.DocumentViewer.Domain.DTOs.AddHighlightTermsToSetRequest'
          description: Gets or sets terms.
      additionalProperties: false
    Relativity.DocumentViewer.Domain.DTOs.AddHighlightTermsToSetRequest:
      type: object
      properties:
        Term:
          type:
          - string
          - 'null'
        BackgroundColor:
          type:
          - string
          - 'null'
        ForegroundColor:
          type:
          - string
          - 'null'
      additionalProperties: false
    Relativity.DocumentViewer.Services.V2.PersistentHighlightSetDTO:
      type: object
      properties:
        SetID:
          type:
          - string
          - 'null'
        SetName:
          type:
          - string
          - 'null'
        Expanded:
          type: boolean
        Selected:
          type: boolean
        PersistentHighlightSetID:
          type: integer
          format: int64
        PersistentHighlightTerms:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Relativity.DocumentViewer.Domain.DTOs.PersistentHighlightTerm'
        Order:
          type: integer
          format: int32
        HasEditPermission:
          type: boolean
        Syntax:
          type:
          - string
          - 'null'
      additionalProperties: false
    Reviewservice.Api.V2.Models.SavePersistentHighlightSetStateRequest:
      type: object
      properties:
        workspaceId:
          type: integer
          description: Gets or sets workspaceId.
          format: int32
        persistentHighlightSetId:
          type: integer
          description: Gets or sets persistentHighlightSetId.
          format: int32
        termIds:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: Gets or sets termIds.
        action:
          $ref: '#/components/schemas/Relativity.DocumentViewer.Domain.DTOs.PersistentHighlightStateAction'
      additionalProperties: false
    Relativity.DocumentViewer.Domain.DTOs.PersistentHighlightStateAction:
      enum:
      - None
      - Enabled
      - Disabled
      - Expanded
      - Collapsed
      type: string
  securitySchemes:
    Bearer:
      type: http
      description: 'Standard Authorization header using the Bearer scheme. Example: "bearer {token}"'
      scheme: bearer
      bearerFormat: JWT
