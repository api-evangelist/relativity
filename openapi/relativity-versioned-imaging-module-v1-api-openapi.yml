          enum:
          - Tiff
          - Jpeg
          type: string
        ImageSize:
          enum:
          - OriginalSetting
          - Letter
          - A4
          - Legal
          - Custom
          type: string
        MaximumImageHeight:
          type:
          - number
          - 'null'
        MaximumImageWidth:
          type:
          - number
          - 'null'
        BasicWordIncludeComments:
          type:
          - boolean
          - 'null'
        BasicPowerPointIncludeComments:
          type:
          - boolean
          - 'null'
        BasicPowerPointShowSpeakerNotes:
          type:
          - boolean
          - 'null'
        WordIncludeTrackChanges:
          type:
          - boolean
          - 'null'
