components:
  schemas:
    PresentationOptions:
      title: PresentationOptions
      type: object
      properties:
        ShowSpeakerNotes:
          type: boolean
        SlideOrientation:
          enum:
          - OriginalSetting
          - Portrait
          - Landscape
          type: string
    ImagingSetResponse:
      title: ImagingSetResponse
      type: object
      properties:
        ImagingJobID:
          type: integer
    ImagingSet:
      title: ImagingSet
      type: object
      properties:
        ImagingProfile:
          $ref: '#/components/schemas/ImagingProfileRef'
        DataSourceID:
          type: integer
        EmailNotificationRecipients:
          type: string
        Status:
          $ref: '#/components/schemas/ImagingSetStatus'
        ArtifactID:
          type: integer
        Name:
          type: string
    NativeImagingEngineOptions:
      title: NativeImagingEngineOptions
      type: object
      properties:
        ImageOutputDpi:
          type: integer
        NativeImageFormat:
          enum:
          - Tiff
          - Jpeg
          type: string
        RenderColorPagesToJpeg:
          type:
          - boolean
          - 'null'
        MaxPagesPerDoc:
          type:
          - integer
          - 'null'
        DitheringAlgorithm:
          enum:
          - Clustered6X6
          - Clustered8X8
          - Clustered16X16
          - Dispersed4X4
          - Dispersed8X8
          - Dispersed16X16
          - FloydAndSteinberg
          - Threshold
          type:
          - string
          - 'null'
        DitheringThreshold:
          type:
          - integer
          - 'null'
        TimeZoneFieldOnDocument:
          $ref: '#/components/schemas/FieldRef'
        LastModifiedDateOnDocument:
          $ref: '#/components/schemas/FieldRef'
    UpdateJobPriorityRequest:
      title: UpdateJobPriorityRequest
      type: object
      properties:
        Priority:
          type: integer
        OriginationID:
          type:
          - string
          - 'null'
    NativeTypeRef:
      title: NativeTypeRef
      type: object
      properties:
        ArtifactID:
          type: integer
        Name:
          type: string
    ImagingProfileUpdateRequest:
      title: ImagingProfileUpdateRequest
      type: object
      properties:
        ImagingMethod:
          enum:
          - Basic
          - Native
          type: string
        NativeOptions:
          $ref: '#/components/schemas/NativeImagingEngineOptions'
        SpreadsheetOptions:
          $ref: '#/components/schemas/SpreadsheetOptions'
        EmailOptions:
          $ref: '#/components/schemas/EmailOptions'
        WordProcessingOptions:
          $ref: '#/components/schemas/WordProcessingOptions'
        PresentationOptions:
          $ref: '#/components/schemas/PresentationOptions'
        HtmlOptions:
          $ref: '#/components/schemas/HtmlOptions'
        ApplicationFieldCodes:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationFieldCodeRef'
        Name:
          type: string
        BasicOptions:
          $ref: '#/components/schemas/BasicImagingEngineOptions'
        Keywords:
          type: string
        Notes:
          type: string
        NativeTypes:
          type: array
          items:
            $ref: '#/components/schemas/NativeTypeRef'
    NativeImagingProfileCreateRequest:
      title: NativeImagingProfileCreateRequest
      type: object
      properties:
        NativeOptions:
          $ref: '#/components/schemas/NativeImagingEngineOptions'
        SpreadsheetOptions:
          $ref: '#/components/schemas/SpreadsheetOptions'
        EmailOptions:
          $ref: '#/components/schemas/EmailOptions'
        WordProcessingOptions:
          $ref: '#/components/schemas/WordProcessingOptions'
        PresentationOptions:
          $ref: '#/components/schemas/PresentationOptions'
        HtmlOptions:
          $ref: '#/components/schemas/HtmlOptions'
        ApplicationFieldCodes:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationFieldCodeRef'
        Name:
          type: string
        BasicOptions:
