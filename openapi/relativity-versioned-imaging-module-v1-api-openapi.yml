      type: object
      properties:
        Success:
          type: boolean
        ErrorMessage:
          type: string
    DocumentError:
      title: DocumentError
      type: object
      properties:
        Message:
          type: string
        Status:
          type: string
    MassImagingResponse:
      title: MassImagingResponse
      type: object
      properties:
        ImagingJobID:
          type: integer
    ImagingProfileRef:
      title: ImagingProfileRef
      type: object
      properties:
        ArtifactID:
          type: integer
        Name:
          type: string
    HtmlOptions:
      title: HtmlOptions
      type: object
      properties:
        RemoveNonBreakingSpaceCodes:
          type: boolean
    ApplicationFieldCode:
