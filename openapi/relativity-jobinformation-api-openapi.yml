openapi: 3.2.0
info:
  title: Relativity.ARM.Services.Interfaces Job Information API
  description: Relativity.ARM.Services.Interfaces
  version: V3
servers:
- url: /Relativity.REST/api/relativity-arm
  description: The URL prefix for all Kepler services
tags:
- name: JobInformation
paths:
  /v3/jobs/{jobID}/status:
    get:
      tags:
      - JobInformation
      summary: Asynchronously retrieves the current status and progress of a job
      parameters:
      - name: jobID
        in: path
        description: Job identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobProgressResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      operationId: getV3JobsByJobIDStatus
      x-operation-id-source: derived
components:
  schemas:
    JobProgressResponse:
      type: object
      properties:
        jobId:
          type:
          - string
          - 'null'
          description: Unique identifier of the job
        jobState:
          $ref: '#/components/schemas/JobProgressStatus'
      additionalProperties: false
      description: Response containing job progress information
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    JobProgressStatus:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: Job progress status values
      format: int32
