components:
  parameters:
    indexID:
      name: indexID
      in: path
      description: ''
      required: true
      schema:
        type: integer
    workspaceID:
      name: workspaceID
      in: path
      description: ''
      required: true
      schema:
        type: integer
    jobType:
      name: jobType
      in: query
      description: ''
      required: true
      schema:
        enum:
        - FullPopulation
        - IncrementalPopulation
        - RetryErrors
        - RemoveDocumentsInError
        - Build
        - Activate
        - Deactivate
        - TagDocuments
        type: string
  schemas:
    ConceptualIndex:
      title: ConceptualIndex
      type: object
      properties:
        ArtifactID:
          type: integer
        Guids:
          type: array
          items:
            type: string
        AnalyticsServer:
          $ref: '#/components/schemas/ArtifactRef'
        ConceptStopWords:
          type: string
        Dimensions:
          type: integer
        EmailNotificationRecipients:
          type: array
          items:
            type: string
        Name:
          type: string
        OptimizeTrainingSet:
          type: boolean
        Order:
          type: integer
        RemoveEngSignaturesAndFooters:
          type: boolean
        EnableEmailHeaderFilter:
          type: boolean
        RepeatedContentFilters:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRef'
        SearchableSet:
          $ref: '#/components/schemas/ArtifactRef'
        TrainingSet:
          $ref: '#/components/schemas/ArtifactRef'
        Active:
          type: boolean
        RemoveDocumentErrors:
          type: boolean
        ContinueIndexStepsToCompletion:
          type: boolean
        LastErrorMessage:
          type: string
        IndexLastUsedOn:
          type: string
          format: date-time
        InUseByCategorizationSet:
          type: boolean
    ArtifactRef:
      title: ArtifactRef
      type: object
      properties:
        ArtifactID:
          type: integer
        Guids:
          type: array
          items:
            type: string
