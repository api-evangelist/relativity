openapi: 3.2.0
info:
  title: Relativity.ARM.Services.Interfaces Job Actions API
  description: Relativity.ARM.Services.Interfaces
  version: V3
servers:
- url: /Relativity.REST/api/relativity-arm
  description: The URL prefix for all Kepler services
tags:
- name: Job Actions
paths:
  /v3/jobs/{jobID}/cancel:
    post:
      tags:
      - Job Actions
      summary: Asynchronously cancels a running job
      parameters:
      - name: jobID
        in: path
        description: Job identifier
        required: true
        schema:
          type: string
      requestBody:
        description: Cancel job request with optional parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelJobRequestWrapper'
          text/json:
            schema:
              $ref: '#/components/schemas/CancelJobRequestWrapper'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CancelJobRequestWrapper'
      responses:
        '200':
          description: Job cancellation initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelJobResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      operationId: postV3JobsByJobIDCancel
      x-operation-id-source: derived
  /v3/jobs/{jobID}/run:
    post:
      tags:
      - Job Actions
      summary: Asynchronously runs a job
      parameters:
      - name: jobID
        in: path
        description: Job identifier
        required: true
        schema:
          type: string
      requestBody:
        description: Run job request with optional parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunJobRequestWrapper'
          text/json:
            schema:
              $ref: '#/components/schemas/RunJobRequestWrapper'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RunJobRequestWrapper'
      responses:
        '200':
          description: Job execution initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunJobResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      operationId: postV3JobsByJobIDRun
      x-operation-id-source: derived
components:
  schemas:
    RunJobRequest:
      type: object
      additionalProperties: false
      description: Request for running an ARM Job
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    CancelJobRequest:
      type: object
      additionalProperties: false
      description: Request for cancelling an ARM Job
    CancelJobResponse:
      type: object
      additionalProperties: false
      description: Response for cancelling an ARM Job
    RunJobRequestWrapper:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/RunJobRequest'
      additionalProperties: false
      description: Request for running an ARM Job
    RunJobResponse:
      type: object
      additionalProperties: false
      description: Response for running an ARM Job
    CancelJobRequestWrapper:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/CancelJobRequest'
      additionalProperties: false
      description: Request for cancelling an ARM Job
