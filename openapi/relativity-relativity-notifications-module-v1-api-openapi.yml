openapi: 3.2.0
info:
  title: Relativity.Notifications.V1 Relativity Notifications Module…
  description: Relativity.Notifications
  version: V1
servers:
- url: /Relativity.REST/api
  description: The URL prefix for all Kepler services
tags:
- name: Relativity Notifications Module v1
paths:
  /relativity-notifications/v1/workspaces/-1/notifications/email:
    post:
      tags:
      - Relativity Notifications Module v1
      description: '[Public] IEmailNotificationsManager -'
      operationId: Relativity.Notifications.V1.IEmailNotificationsManager.SendEmailNotificationAsync
      parameters:
      - $ref: '#/components/parameters/x-csrf-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailNotificationRequest'
        required: true
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailNotificationResponse'
      summary: Relativity notifications V1 IEmail notifications manager send email…
      x-summary-source: derived
components:
  schemas:
    EmailNotificationStatus:
      title: EmailNotificationStatus
      type: object
      properties:
        Recipient:
          type: string
        IsSent:
          type: boolean
        Message:
          type: string
    EmailNotificationResponse:
      title: EmailNotificationResponse
      type: object
      properties:
        EmailNotifications:
          type: array
          items:
            $ref: '#/components/schemas/EmailNotificationStatus'
    EmailNotificationRequest:
      title: EmailNotificationRequest
      type: object
      properties:
        Sender:
          type: string
        Recipients:
          type: array
          items:
            type: string
        Subject:
          type: string
        Body:
          type: string
        IsBodyHtml:
          type: boolean
  parameters:
    x-csrf-header:
      name: x-csrf-header
      in: header
      description: ''
      required: true
      schema:
        type: string
        default: '-'
