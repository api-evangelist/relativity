openapi: 3.2.0
info:
  title: Relativity Transfer Service Transfer Controller V2 API
security:
- Bearer: []
tags:
- name: TransferControllerV2
paths:
  /v2/transfer/jobs:
    post:
      tags:
      - TransferControllerV2
      parameters:
      - name: correlation-id
        in: header
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequestV2'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequestV2'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequestV2'
      responses:
        '200':
          description: Success
      summary: Create transfer jobs
      x-summary-source: derived
      operationId: postV2TransferJobs
      x-operation-id-source: derived
  /v2/transfer/jobs/{jobId}:
    get:
      tags:
      - TransferControllerV2
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: correlation-id
        in: header
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetJobResultV2'
            application/json:
              schema:
                $ref: '#/components/schemas/GetJobResultV2'
            text/json:
              schema:
                $ref: '#/components/schemas/GetJobResultV2'
      summary: Get transfer jobs by job id
      x-summary-source: derived
      operationId: getV2TransferJobsByJobId
      x-operation-id-source: derived
    delete:
      tags:
      - TransferControllerV2
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: correlation-id
        in: header
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
      summary: Delete transfer jobs by job id
      x-summary-source: derived
      operationId: deleteV2TransferJobsByJobId
      x-operation-id-source: derived
  /v2/transfer/jobs/{jobId}/qc:
    get:
      tags:
      - TransferControllerV2
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: correlation-id
        in: header
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetTokenResult'
            application/json:
              schema:
                $ref: '#/components/schemas/GetTokenResult'
            text/json:
              schema:
                $ref: '#/components/schemas/GetTokenResult'
      summary: Get transfer jobs by job id qc
      x-summary-source: derived
      operationId: getV2TransferJobsByJobIdQc
      x-operation-id-source: derived
components:
  schemas:
    TransferStatistics:
      type: object
      properties:
        successfulFiles:
          type: integer
          format: int64
        failedFiles:
          type: integer
          format: int64
        skippedFiles:
          type: integer
          format: int64
        successfulBytes:
          type: integer
          format: int64
        failedBytes:
          type: integer
          format: int64
        skippedBytes:
          type: integer
          format: int64
        successfulEmptyDirectories:
          type: integer
          format: int64
        failedEmptyDirectories:
          type: integer
          format: int64
        skippedEmptyDirectories:
          type: integer
          format: int64
      additionalProperties: false
    GetTokenResult:
      type: object
      properties:
        sasUrl:
          type:
          - string
          - 'null'
          format: uri
      additionalProperties: false
    EnumerationStatistics:
      type: object
      properties:
        totalFiles:
          type: integer
          format: int64
        totalSize:
          type: integer
          format: int64
        totalEmptyDirectories:
          type: integer
          format: int64
        status:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
      additionalProperties: false
    GetJobResultV2:
      type: object
      properties:
        transferStatus:
          type:
          - string
          - 'null'
        transferJobID:
          type: string
          format: uuid
        destinationFullPath:
          type:
          - string
          - 'null'
        sourceFullPath:
          type:
          - string
          - 'null'
        tags:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        eta:
          $ref: '#/components/schemas/TimeSpan'
        transferStatistics:
          $ref: '#/components/schemas/TransferStatistics'
        enumerationStatistics:
          $ref: '#/components/schemas/EnumerationStatistics'
        transferType:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreateTransferRequestV2:
      type: object
      properties:
        destinationPath:
          type:
          - string
          - 'null'
        sourcePath:
          type:
          - string
          - 'null'
        tags:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        transferType:
          type:
          - string
          - 'null'
        transferJobID:
          type: string
          format: uuid
      additionalProperties: false
    TimeSpan:
      type: object
      properties:
        ticks:
          type: integer
          format: int64
        days:
          type: integer
          format: int32
          readOnly: true
        hours:
          type: integer
          format: int32
          readOnly: true
        milliseconds:
          type: integer
          format: int32
          readOnly: true
        microseconds:
          type: integer
          format: int32
          readOnly: true
        nanoseconds:
          type: integer
          format: int32
          readOnly: true
        minutes:
          type: integer
          format: int32
          readOnly: true
        seconds:
          type: integer
          format: int32
          readOnly: true
        totalDays:
          type: number
          format: double
          readOnly: true
        totalHours:
          type: number
          format: double
          readOnly: true
        totalMilliseconds:
          type: number
          format: double
          readOnly: true
        totalMicroseconds:
          type: number
          format: double
          readOnly: true
        totalNanoseconds:
          type: number
          format: double
          readOnly: true
        totalMinutes:
          type: number
          format: double
          readOnly: true
        totalSeconds:
          type: number
          format: double
          readOnly: true
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: 'Standard Authorization header using the Bearer scheme. Example: "bearer {token}"'
      scheme: bearer
      bearerFormat: JWT
