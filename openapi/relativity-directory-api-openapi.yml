openapi: 3.2.0
info:
  title: Staging Reports Directory API
  version: v4
servers:
- url: https://{host}/Relativity.REST/api/staging-insights
  variables:
    host:
      default: host
      description: Your RelativityOne tenant name
security:
- Bearer: []
tags:
- name: Directory
paths:
  /v4/Directory/containers:
    get:
      tags:
      - Directory
      summary: Get available containers
      description: This endpoint retrieves a list of all available containers.
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: getV4DirectoryContainers
      x-operation-id-source: derived
  /v4/Directory/directories:
    post:
      tags:
      - Directory
      summary: Get directory listing
      description: This endpoint retrieves a paginated list of directories based on the specified path and paging parameters.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryListRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DirectoryListRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DirectoryListRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: postV4DirectoryDirectories
      x-operation-id-source: derived
components:
  schemas:
    Microsoft.AspNetCore.Mvc.ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Page:
      required:
      - limit
      - start
      type: object
      properties:
        start:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
        limit:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
      additionalProperties: false
    DirectoryListRequest:
      required:
      - path
      type: object
      properties:
        path:
          minLength: 1
          type: string
        paging:
          $ref: '#/components/schemas/Page'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: 'Standard Authorization header using the Bearer scheme. Example: "bearer {token}"'
      scheme: bearer
      bearerFormat: JWT
